<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoleWeaver Chat</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f5;
      --panel: #ffffff;
      --panel-soft: #f0f2f4;
      --text: #202123;
      --muted: #6b7280;
      --line: #d8dde3;
      --accent: #10a37f;
      --accent-dark: #0c8467;
      --danger: #b42318;
      --shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: #202123;
      color: #f9fafb;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 650;
    }

    .brand span {
      color: #b7bbc3;
      font-size: 13px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      color: #cbd5e1;
      font-size: 12px;
    }

    .field input {
      width: 100%;
      border: 1px solid #3c414b;
      background: #2b2d35;
      color: #f8fafc;
      border-radius: 8px;
      padding: 10px 11px;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .side-actions {
      display: grid;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
    }

    .side-button {
      background: #343541;
      color: #f8fafc;
      padding: 10px 12px;
      text-align: left;
    }

    .side-button:hover {
      background: #3f404d;
    }

    .status {
      margin-top: auto;
      padding: 12px;
      background: #2b2d35;
      border-radius: 8px;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.55;
      word-break: break-word;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    .topbar {
      height: 64px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      backdrop-filter: blur(10px);
    }

    .topbar-title {
      min-width: 0;
    }

    .topbar-title strong {
      display: block;
      font-size: 16px;
    }

    .topbar-title span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    .health-pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .messages {
      overflow-y: auto;
      padding: 24px;
    }

    .empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
      padding: 24px;
    }

    .empty h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 24px;
      font-weight: 650;
    }

    .message {
      display: grid;
      grid-template-columns: 38px minmax(0, 760px);
      gap: 14px;
      max-width: 920px;
      margin: 0 auto 22px;
      align-items: start;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 700;
      color: #fff;
      background: #4b5563;
    }

    .message.assistant .avatar {
      background: var(--accent);
    }

    .bubble {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 14px 16px;
      line-height: 1.72;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user .bubble {
      background: var(--panel-soft);
      box-shadow: none;
    }

    .composer-wrap {
      border-top: 1px solid var(--line);
      background: rgba(247, 247, 245, 0.94);
      padding: 16px 24px 22px;
    }

    .composer {
      max-width: 920px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 10px;
    }

    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: vertical;
      border: 0;
      outline: none;
      padding: 10px 12px;
      font: inherit;
      line-height: 1.55;
      background: transparent;
      color: var(--text);
    }

    .send-button {
      align-self: end;
      min-width: 72px;
      height: 42px;
      padding: 0 16px;
      background: var(--accent);
      color: #fff;
      font-weight: 650;
    }

    .send-button:hover {
      background: var(--accent-dark);
    }

    .send-button:disabled,
    .side-button:disabled {
      cursor: wait;
      opacity: 0.62;
    }

    .hint {
      max-width: 920px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      max-width: 420px;
      background: #111827;
      color: #fff;
      padding: 12px 14px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
      font-size: 13px;
      line-height: 1.5;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
      }

      .main {
        height: auto;
        min-height: 100vh;
      }

      .topbar {
        padding: 0 16px;
      }

      .messages,
      .composer-wrap {
        padding-left: 14px;
        padding-right: 14px;
      }

      .message {
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .avatar {
        width: 32px;
        height: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>RoleWeaver</h1>
        <span>Local role chat runtime</span>
      </div>

      <div class="field">
        <label for="sessionId">Session ID</label>
        <input id="sessionId" value="web" autocomplete="off">
      </div>

      <div class="field">
        <label for="maxTokens">Max new tokens</label>
        <input id="maxTokens" type="number" min="16" max="4096" step="16" value="160">
      </div>

      <div class="side-actions">
        <button class="side-button" id="newChatButton" type="button">New chat</button>
        <button class="side-button" id="consolidateButton" type="button">Consolidate memory</button>
        <button class="side-button" id="healthButton" type="button">Check runtime</button>
      </div>

      <div class="status" id="statusBox">Connecting to RoleWeaver...</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <strong id="roleName">RoleWeaver Chat</strong>
          <span id="roleSubtitle">ChatGPT-style local frontend</span>
        </div>
        <div class="health-pill" id="healthPill">offline</div>
      </header>

      <section class="messages" id="messages">
        <div class="empty" id="emptyState">
          <div>
            <h2>开始和你的角色聊天</h2>
            <p>输入一条消息，RoleWeaver 会调用本地 API，并自动使用当前 session 的记忆。</p>
          </div>
        </div>
      </section>

      <section class="composer-wrap">
        <form class="composer" id="chatForm">
          <textarea id="promptInput" rows="1" placeholder="给角色发送消息，Enter 发送，Shift+Enter 换行"></textarea>
          <button class="send-button" id="sendButton" type="submit">Send</button>
        </form>
        <div class="hint">前端不会保存到服务器；浏览器本地只缓存当前页面消息。</div>
      </section>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const state = {
      messages: JSON.parse(localStorage.getItem("roleweaver.messages") || "[]"),
      busy: false,
    };

    const messagesEl = document.getElementById("messages");
    const emptyState = document.getElementById("emptyState");
    const promptInput = document.getElementById("promptInput");
    const sendButton = document.getElementById("sendButton");
    const sessionInput = document.getElementById("sessionId");
    const maxTokensInput = document.getElementById("maxTokens");
    const statusBox = document.getElementById("statusBox");
    const healthPill = document.getElementById("healthPill");
    const roleName = document.getElementById("roleName");
    const roleSubtitle = document.getElementById("roleSubtitle");
    const toast = document.getElementById("toast");

    function saveMessages() {
      localStorage.setItem("roleweaver.messages", JSON.stringify(state.messages.slice(-80)));
    }

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 3200);
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderMessages() {
      messagesEl.innerHTML = "";
      if (state.messages.length === 0) {
        messagesEl.appendChild(emptyState);
        return;
      }

      for (const message of state.messages) {
        const row = document.createElement("article");
        row.className = `message ${message.role}`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = message.role === "user" ? "U" : "R";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = message.content;

        row.appendChild(avatar);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      }
      scrollToBottom();
    }

    function setBusy(busy) {
      state.busy = busy;
      sendButton.disabled = busy;
      promptInput.disabled = busy;
      sendButton.textContent = busy ? "..." : "Send";
    }

    async function checkHealth() {
      try {
        const res = await fetch("/health");
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        healthPill.textContent = "online";
        roleName.textContent = data.role_name || "RoleWeaver Chat";
        roleSubtitle.textContent = data.skill_file ? `Skill: ${data.skill_file}` : "No skill file configured";
        statusBox.textContent = [
          "API: online",
          `Role: ${data.role_name || "RoleWeaver"}`,
          `Base: ${data.base_model_path || "-"}`,
          `LoRA: ${data.lora_path || "-"}`,
        ].join("\n");
      } catch (err) {
        healthPill.textContent = "offline";
        statusBox.textContent = `API offline: ${err.message}`;
      }
    }

    async function sendMessage(text) {
      const sessionId = sessionInput.value.trim() || "web";
      const maxNewTokens = Number(maxTokensInput.value || 160);

      state.messages.push({ role: "user", content: text });
      state.messages.push({ role: "assistant", content: "正在思考..." });
      saveMessages();
      renderMessages();
      setBusy(true);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_text: text,
            session_id: sessionId,
            max_new_tokens: maxNewTokens,
          }),
        });
        if (!res.ok) {
          const detail = await res.text();
          throw new Error(detail || `HTTP ${res.status}`);
        }
        const data = await res.json();
        state.messages[state.messages.length - 1] = {
          role: "assistant",
          content: data.text || "",
        };
      } catch (err) {
        state.messages[state.messages.length - 1] = {
          role: "assistant",
          content: `请求失败：${err.message}`,
        };
        showToast("请求失败，请检查终端日志和模型配置。");
      } finally {
        saveMessages();
        renderMessages();
        setBusy(false);
        promptInput.focus();
      }
    }

    document.getElementById("chatForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = promptInput.value.trim();
      if (!text || state.busy) return;
      promptInput.value = "";
      sendMessage(text);
    });

    promptInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        document.getElementById("chatForm").requestSubmit();
      }
    });

    document.getElementById("newChatButton").addEventListener("click", () => {
      state.messages = [];
      saveMessages();
      renderMessages();
      promptInput.focus();
    });

    document.getElementById("consolidateButton").addEventListener("click", async () => {
      const sessionId = encodeURIComponent(sessionInput.value.trim() || "web");
      try {
        const res = await fetch(`/consolidate/${sessionId}`, { method: "POST" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        showToast("记忆整理完成。");
      } catch (err) {
        showToast(`记忆整理失败：${err.message}`);
      }
    });

    document.getElementById("healthButton").addEventListener("click", checkHealth);

    renderMessages();
    checkHealth();
  </script>
</body>
</html>
